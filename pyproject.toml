[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralfabric"
version = "1.1.0"
description = "A from-scratch machine learning and deep learning framework, from tensors to transformers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
    { name = "Aryan Patel", email = "aryanpatel2906.ap@gmail.com" },
]

keywords = [
    "machine-learning",
    "deep-learning",
    "neural-networks",
    "transformers",
    "autograd",
    "tensors",
    "artificial-intelligence",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.4.1,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "twine>=6.0",
]

docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
]

viz = [
    "matplotlib>=3.9",
]

[project.urls]
Repository = "https://github.com/aryanap07/neuralfabric"
Issues = "https://github.com/aryanap07/neuralfabric/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuralfabric = [
    "datasets/data/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]